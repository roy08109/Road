<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高级网格管理系统</title>
    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        /* 密码验证区域 */
        #passwordSection {
            text-align: center;
            margin-bottom: 20px;
        }

        #passwordInput {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin-right: 10px;
        }

        #passwordBtn {
            padding: 8px 16px;
            background: #3366ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        #passwordBtn:hover {
            background: #2952cc;
        }

        #passwordError {
            color: #ff3333;
            margin-top: 8px;
            font-size: 12px;
        }

        /* 网格样式 */
        #gridContainer {
            margin: 20px 0;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(16, 25px);
            grid-template-rows: repeat(13, 25px);
            gap: 3px;
            background: #e0e0e0;
            padding: 2px;
            border: 1px solid #e0e0e0;
        }

        .cell {
            width: 25px;
            height: 25px;
            background: #ffffff;
            position: relative;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .cell:hover {
            background-color: #f5f5f5;
        }

        .cell.number-cell {
            background: #f0f0f0;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #333333;
        }

        .cell.number-cell:hover {
            background: #f0f0f0;
        }

        /* 圈形样式 */
        .circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        .circle.red {
            background: #fe0002;
            border: 1px solid #000000;
        }

        .circle.blue {
            background: #0000fe;
            border: 1px solid #000000;
        }

        .circle.hidden {
            display: none;
        }

        /* 控制区域 */
        #controls {
            display: none;
            margin-bottom: 20px;
            text-align: center;
        }

        .tool-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .tool-btn {
            padding: 8px 16px;
            border: 1px solid #e0e0e0;
            background: #ffffff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #f5f5f5;
        }

        .tool-btn.active {
            background: #e6f7ff;
            border-color: #3366ff;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
        }

        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        #saveBtn {
            background: #52c41a;
            color: white;
        }

        #saveBtn:hover {
            background: #45a612;
        }

        /* 底部按钮区域 */
        #bottomButtons {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .number-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 400px;
        }

        .number-btn {
            flex: 1;
            width: 40px;
            height: 40px;
            padding: 0;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .number-btn:hover {
            background: #f5f5f5;
        }

        .number-btn.active {
            background: #e6f7ff;
            border-color: #3366ff;
        }

        #showAllBtn {
            background: #3366ff;
            color: white;
            padding: 10px 40px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }

        #showAllBtn:hover {
            background: #2952cc;
        }

        /* 状态提示 */
        #status {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }

        /* 移动端响应式适配 */
        @media screen and (max-width: 768px) {
            /* 基础布局调整 */
            body {
                padding: 10px;
                min-height: 100vh;
                overflow-x: hidden;
            }

            /* 密码验证区域优化 */
            #passwordSection {
                margin-bottom: 15px;
                padding: 0 10px;
            }

            #passwordInput {
                width: 120px;
                margin-right: 5px;
                font-size: 13px;
            }

            #passwordBtn {
                padding: 6px 12px;
                font-size: 13px;
            }

            /* 网格容器响应式 */
            #gridContainer {
                margin: 15px 0;
                display: flex;
                justify-content: center;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            /* 网格响应式缩放 */
            #grid {
                transform: scale(0.8);
                transform-origin: center top;
                min-width: 448px; /* (25px + 3px) * 16 - 3px */
                margin: 0 auto;
            }

            /* 控制区域优化 */
            #controls {
                margin-bottom: 15px;
            }

            .tool-buttons {
                gap: 6px;
                margin-bottom: 10px;
                flex-wrap: wrap;
            }

            .tool-btn {
                padding: 6px 10px;
                font-size: 12px;
                min-width: 70px;
            }

            .action-buttons {
                margin-top: 5px;
            }

            .action-btn {
                padding: 8px 16px;
                font-size: 12px;
            }

            /* 底部按钮区域优化 */
            #bottomButtons {
                margin-top: 15px;
                padding: 0 5px;
            }

            .number-buttons {
                gap: 4px;
                margin-bottom: 10px;
                max-width: 320px;
            }

            .number-btn {
                width: 35px;
                height: 35px;
                font-size: 12px;
            }

            #showAllBtn {
                padding: 8px 24px;
                font-size: 14px;
                margin-top: 10px;
            }

            /* 标题优化 */
            h1, h2 {
                font-size: 16px;
                margin-bottom: 8px;
            }

            /* 状态提示优化 */
            #status {
                font-size: 11px;
                margin-top: 10px;
            }
        }

        /* 超小屏幕适配 */
        @media screen and (max-width: 480px) {
            #grid {
                transform: scale(0.7);
                min-width: 392px;
            }

            .number-buttons {
                max-width: 280px;
            }

            .number-btn {
                width: 30px;
                height: 30px;
                font-size: 11px;
            }

            .tool-btn {
                min-width: 60px;
                padding: 5px 8px;
            }
        }

        /* 触摸优化 */
        @media (hover: none) and (pointer: coarse) {
            .cell:hover {
                background-color: #ffffff;
            }

            .cell:active {
                background-color: #f0f0f0;
            }

            .tool-btn:active,
            .number-btn:active {
                transform: scale(0.95);
            }
        }

        /* 横屏适配 */
        @media screen and (max-width: 768px) and (orientation: landscape) {
            #grid {
                transform: scale(0.85);
            }

            body {
                padding: 5px 10px;
            }
        }
    </style>
</head>
<body>
    <!-- 密码验证区域 -->
    <div id="passwordSection">
        <h2>管理员登录</h2>
        <div style="margin-top: 10px;">
            <input type="password" id="passwordInput" placeholder="请输入管理员密码">
            <button id="passwordBtn">验证</button>
        </div>
        <div id="passwordError"></div>
    </div>

    <!-- 控制区域（初始隐藏） -->
    <div id="controls">
        <div class="tool-buttons">
            <button class="tool-btn" id="redTool" data-tool="red">红圈选择</button>
            <button class="tool-btn" id="blueTool" data-tool="blue">蓝圈选择</button>
            <button class="tool-btn" id="clearTool" data-tool="clear">清空选择</button>
        </div>
        <div class="action-buttons">
            <button class="action-btn" id="saveBtn">确定保存</button>
        </div>
    </div>

    <!-- 网格容器 -->
    <div id="gridContainer">
        <div id="grid"></div>
    </div>

    <!-- 底部按钮区域 -->
    <div id="bottomButtons">
        <div class="number-buttons">
            <button class="number-btn" data-col="1">1</button>
            <button class="number-btn" data-col="2">2</button>
            <button class="number-btn" data-col="3">3</button>
            <button class="number-btn" data-col="4">4</button>
            <button class="number-btn" data-col="5">5</button>
            <button class="number-btn" data-col="6">6</button>
            <button class="number-btn" data-col="7">7</button>
            <button class="number-btn" data-col="8">8</button>
        </div>
        <div class="number-buttons">
            <button class="number-btn" data-col="9">9</button>
            <button class="number-btn" data-col="10">10</button>
            <button class="number-btn" data-col="11">11</button>
            <button class="number-btn" data-col="12">12</button>
            <button class="number-btn" data-col="13">13</button>
            <button class="number-btn" data-col="14">14</button>
            <button class="number-btn" data-col="15">15</button>
            <button class="number-btn" data-col="16">16</button>
        </div>
        <button id="showAllBtn">显示全部</button>
    </div>

    <!-- 状态提示 -->
    <div id="status"></div>

    <script>
        // 管理员密码配置（可修改）
        const ADMIN_PASSWORD = '8888'; // 修改此处可更改管理员密码
        
        // 全局变量
        let isAdmin = false;
        let currentTool = 'red';
        let isDragging = false;
        let currentColumn = null;
        
        const rows = 13;
        const cols = 16;
        const numberRow = 6; // 第6行是数字行（0索引为5）
        
        // 网格数据存储
        let gridData = {};
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeGrid();
            loadFromLocalStorage();
            setupEventListeners();
            // 如果没有保存的数据，加载预设坐标
            if (Object.keys(gridData).length === 0) {
                setPredefinedCoordinates();
            }
        });
        
        // 初始化网格
        function initializeGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    // 第6行是数字行（索引5）
                    if (row === numberRow - 1) {
                        cell.classList.add('number-cell');
                        cell.textContent = col + 1;
                    }
                    
                    grid.appendChild(cell);
                }
            }
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 密码验证
            document.getElementById('passwordBtn').addEventListener('click', verifyPassword);
            document.getElementById('passwordInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') verifyPassword();
            });
            
            // 工具按钮
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    setTool(this.dataset.tool);
                });
            });
            
            // 操作按钮
            document.getElementById('saveBtn').addEventListener('click', saveToLocalStorage);
            
            // 数字按钮
            document.querySelectorAll('.number-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    showColumnOnly(Number(this.dataset.col));
                });
            });
            
            // 显示全部按钮
            document.getElementById('showAllBtn').addEventListener('click', showAllColumns);
            
            // 网格事件（使用事件委托）
            document.getElementById('grid').addEventListener('mousedown', handleCellMouseDown);
            document.getElementById('grid').addEventListener('mouseover', handleCellMouseOver);
            document.addEventListener('mouseup', handleMouseUp);
            
            // 防止拖拽选择文本
            document.getElementById('grid').addEventListener('selectstart', function(e) {
                e.preventDefault();
            });
        }
        
        // 验证密码
        function verifyPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('passwordError');
            
            if (input === ADMIN_PASSWORD) {
                isAdmin = true;
                document.getElementById('passwordSection').style.display = 'none';
                document.getElementById('controls').style.display = 'block';
                document.getElementById('passwordInput').disabled = true;
                errorDiv.textContent = '';
                showStatus('管理员验证成功，可以开始操作');
            } else {
                errorDiv.textContent = '密码错误，请重试';
                document.getElementById('passwordInput').value = '';
            }
        }
        
        // 设置工具
        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tool === tool);
            });
            showStatus(`当前工具：${tool === 'red' ? '红圈' : tool === 'blue' ? '蓝圈' : '清空'}`);
        }
        
        // 处理单元格鼠标按下
        function handleCellMouseDown(e) {
            if (!isAdmin) return;
            
            const cell = e.target;
            if (!cell.classList.contains('cell') || cell.classList.contains('number-cell')) return;
            
            isDragging = true;
            applyToolToCell(cell);
            e.preventDefault();
        }
        
        // 处理单元格鼠标悬停
        function handleCellMouseOver(e) {
            if (!isAdmin || !isDragging) return;
            
            const cell = e.target;
            if (!cell.classList.contains('cell') || cell.classList.contains('number-cell')) return;
            
            applyToolToCell(cell);
        }
        
        // 处理鼠标释放
        function handleMouseUp() {
            isDragging = false;
        }
        
        // 应用工具到单元格
        function applyToolToCell(cell) {
            const row = cell.dataset.row;
            const col = cell.dataset.col;
            const key = `${row}-${col}`;
            
            // 移除现有圈形
            const existingCircle = cell.querySelector('.circle');
            if (existingCircle) {
                existingCircle.remove();
            }
            
            if (currentTool === 'clear') {
                delete gridData[key];
            } else {
                // 创建新圈形
                const circle = document.createElement('div');
                circle.className = `circle ${currentTool}`;
                cell.appendChild(circle);
                
                // 保存数据
                gridData[key] = currentTool;
            }
            
            updateColumnVisibility();
        }
        
        // 仅显示指定列
        function showColumnOnly(col) {
            currentColumn = col;
            updateColumnVisibility();
            
            // 更新按钮状态
            document.querySelectorAll('.number-btn').forEach(btn => {
                btn.classList.toggle('active', Number(btn.dataset.col) === col);
            });
        }
        
        // 显示所有列
        function showAllColumns() {
            currentColumn = null;
            updateColumnVisibility();
            
            // 清除按钮激活状态
            document.querySelectorAll('.number-btn').forEach(btn => {
                btn.classList.remove('active');
            });
        }
        
        // 更新列可见性
        function updateColumnVisibility() {
            document.querySelectorAll('.cell').forEach(cell => {
                if (cell.classList.contains('number-cell')) return;
                
                const col = Number(cell.dataset.col) + 1; // 转换为1索引
                const circle = cell.querySelector('.circle');
                
                if (circle) {
                    if (currentColumn === null || currentColumn === col) {
                        circle.classList.remove('hidden');
                    } else {
                        circle.classList.add('hidden');
                    }
                }
            });
        }
        
        // 保存到本地存储
        function saveToLocalStorage() {
            localStorage.setItem('gridData', JSON.stringify(gridData));
            showStatus('数据已保存到本地存储');
        }
        
        // 从本地存储加载
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('gridData');
            if (saved) {
                try {
                    gridData = JSON.parse(saved);
                    applySavedData();
                    showStatus('已加载保存的数据');
                } catch (e) {
                    console.error('加载数据失败:', e);
                    gridData = {};
                }
            }
        }
        
        // 应用保存的数据
        function applySavedData() {
            Object.keys(gridData).forEach(key => {
                const [row, col] = key.split('-').map(Number);
                const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                
                if (cell && !cell.classList.contains('number-cell')) {
                    const circle = document.createElement('div');
                    circle.className = `circle ${gridData[key]}`;
                    cell.appendChild(circle);
                }
            });
            
            updateColumnVisibility();
        }
        
        // 显示状态信息
        function showStatus(message) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            setTimeout(() => {
                statusDiv.textContent = '';
            }, 3000);
        }
        
        // 设置预设坐标
        function setPredefinedCoordinates() {
            const predefinedData = {
                // 第1行：1-8列=红圈，9-16列=蓝圈
                '0-0': 'red', '0-1': 'red', '0-2': 'red', '0-3': 'red', '0-4': 'red', '0-5': 'red', '0-6': 'red', '0-7': 'red',
                '0-8': 'blue', '0-9': 'blue', '0-10': 'blue', '0-11': 'blue', '0-12': 'blue', '0-13': 'blue', '0-14': 'blue', '0-15': 'blue',
                
                // 第2行：1-4列=红圈，5-11列=蓝圈，12-16列=红圈
                '1-0': 'red', '1-1': 'red', '1-2': 'red', '1-3': 'red',
                '1-4': 'blue', '1-5': 'blue', '1-6': 'blue', '1-7': 'blue', '1-8': 'blue', '1-9': 'blue', '1-10': 'blue',
                '1-11': 'red', '1-12': 'red', '1-13': 'red', '1-14': 'red', '1-15': 'red',
                
                // 第3行：1-2列=红圈，3-6列=蓝圈，7-8列=红圈，9-10列=蓝圈，11-14列=红圈，15-16列=蓝圈
                '2-0': 'red', '2-1': 'red',
                '2-2': 'blue', '2-3': 'blue', '2-4': 'blue', '2-5': 'blue',
                '2-6': 'red', '2-7': 'red',
                '2-8': 'blue', '2-9': 'blue',
                '2-10': 'red', '2-11': 'red', '2-12': 'red', '2-13': 'red',
                '2-14': 'blue', '2-15': 'blue',
                
                // 第4行：1列=红圈，2列=蓝圈，3列=红圈，4-5列=蓝圈，6-7列=红圈，8-9列=蓝圈，10列=红圈，11列=蓝圈，12-13列=红圈，14-15列=蓝圈，16列=红圈
                '3-0': 'red', '3-1': 'blue', '3-2': 'red',
                '3-3': 'blue', '3-4': 'blue',
                '3-5': 'red', '3-6': 'red',
                '3-7': 'blue', '3-8': 'blue',
                '3-9': 'red',
                '3-10': 'blue',
                '3-11': 'red', '3-12': 'red',
                '3-13': 'blue', '3-14': 'blue',
                '3-15': 'red',
                
                // 第7行：1-4列=红圈，5列=蓝圈，6-8列=红圈，9-12列=蓝圈，13列=红圈，14-16列=蓝圈
                '6-0': 'red', '6-1': 'red', '6-2': 'red', '6-3': 'red',
                '6-4': 'blue',
                '6-5': 'red', '6-6': 'red', '6-7': 'red',
                '6-8': 'blue', '6-9': 'blue', '6-10': 'blue', '6-11': 'blue',
                '6-12': 'red',
                '6-13': 'blue', '6-14': 'blue', '6-15': 'blue',
                
                // 第8行：1-3列=红圈，4-5列=蓝圈，6-8列=红圈，9-10列=蓝圈，11-14列=红圈，15-16列=蓝圈
                '7-0': 'red', '7-1': 'red', '7-2': 'red',
                '7-3': 'blue', '7-4': 'blue',
                '7-5': 'red', '7-6': 'red', '7-7': 'red',
                '7-8': 'blue', '7-9': 'blue',
                '7-10': 'red', '7-11': 'red', '7-12': 'red', '7-13': 'red',
                '7-14': 'blue', '7-15': 'blue',
                
                // 第9行：1-3列=蓝圈，4-5列=红圈，6列=蓝圈，7-8列=蓝圈，9-10列=红圈，11列=蓝圈，12-13列=蓝圈，14-16列=红圈
                '8-0': 'blue', '8-1': 'blue', '8-2': 'blue',
                '8-3': 'red', '8-4': 'red',
                '8-5': 'blue',
                '8-6': 'blue', '8-7': 'blue',
                '8-8': 'red', '8-9': 'red',
                '8-10': 'blue',
                '8-11': 'blue', '8-12': 'blue',
                '8-13': 'red', '8-14': 'red', '8-15': 'red',
                
                // 第10行：1列=红圈，2列=红圈，3列=蓝圈，4列=红圈，5列=蓝圈，6-7列=蓝圈，8-9列=红圈，10-12列=蓝圈，13-14列=红圈，15-16列=蓝圈
                '9-0': 'red', '9-1': 'red',
                '9-2': 'blue',
                '9-3': 'red',
                '9-4': 'blue',
                '9-5': 'blue', '9-6': 'blue',
                '9-7': 'red', '9-8': 'red',
                '9-9': 'blue', '9-10': 'blue', '9-11': 'blue',
                '9-12': 'red', '9-13': 'red',
                '9-14': 'blue', '9-15': 'blue',
                
                // 第11行：1列=红圈，2列=蓝圈，3列=红圈，4列=蓝圈，5列=红圈，6列=蓝圈，7-9列=红圈，10列=蓝圈，11列=红圈，12-14列=蓝圈，15-16列=蓝圈
                '10-0': 'red',
                '10-1': 'blue',
                '10-2': 'red',
                '10-3': 'blue',
                '10-4': 'red',
                '10-5': 'blue',
                '10-6': 'red', '10-7': 'red', '10-8': 'red',
                '10-9': 'blue',
                '10-10': 'red',
                '10-11': 'blue', '10-12': 'blue', '10-13': 'blue',
                '10-14': 'blue', '10-15': 'blue',
                
                // 第12行：1列=红圈，2-8列=蓝圈，9列=红圈，10列=蓝圈，11-15列=红圈，16列=蓝圈
                '11-0': 'red',
                '11-1': 'blue', '11-2': 'blue', '11-3': 'blue', '11-4': 'blue', '11-5': 'blue', '11-6': 'blue', '11-7': 'blue',
                '11-8': 'red',
                '11-9': 'blue',
                '11-10': 'red', '11-11': 'red', '11-12': 'red', '11-13': 'red', '11-14': 'red',
                '11-15': 'blue'
            };
            
            // 应用预设数据
            gridData = predefinedData;
            applySavedData();
            showStatus('已加载预设坐标');
        }
        
        // 默认选中红圈工具
        setTool('red');
        
        // 移动端触摸优化
        function optimizeForMobile() {
            const isMobile = window.innerWidth <= 768;
            
            if (isMobile) {
                // 优化触摸事件
                let touchStartX, touchStartY;
                
                document.getElementById('grid').addEventListener('touchstart', function(e) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    
                    // 获取触摸位置的元素
                    const element = document.elementFromPoint(touchStartX, touchStartY);
                    if (element && element.classList.contains('cell') && !element.classList.contains('number-cell')) {
                        isDragging = true;
                        applyToolToCell(element);
                    }
                }, { passive: true });
                
                document.getElementById('grid').addEventListener('touchmove', function(e) {
                    if (!isDragging) return;
                    
                    e.preventDefault();
                    const touch = e.touches[0];
                    const element = document.elementFromPoint(touch.clientX, touch.clientY);
                    
                    if (element && element.classList.contains('cell') && !element.classList.contains('number-cell')) {
                        applyToolToCell(element);
                    }
                }, { passive: false });
                
                document.addEventListener('touchend', function() {
                    isDragging = false;
                }, { passive: true });
                
                // 防止页面缩放
                document.addEventListener('gesturestart', function(e) {
                    e.preventDefault();
                }, { passive: false });
                
                // 优化按钮触摸反馈
                document.querySelectorAll('.tool-btn, .number-btn, .action-btn').forEach(btn => {
                    btn.addEventListener('touchstart', function() {
                        this.style.transform = 'scale(0.95)';
                    }, { passive: true });
                    
                    btn.addEventListener('touchend', function() {
                        this.style.transform = '';
                    }, { passive: true });
                });
            }
        }
        
        // 页面加载时优化移动端
        optimizeForMobile();
        window.addEventListener('resize', optimizeForMobile);
    </script>
