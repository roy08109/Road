<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>高级网格管理系统</title>
    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        /* 密码验证区域 */
        #passwordSection {
            text-align: center;
            margin-bottom: 20px;
        }

        #passwordInput {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin-right: 10px;
        }

        #passwordBtn {
            padding: 8px 16px;
            background: #3366ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        #passwordBtn:hover {
            background: #2952cc;
        }

        #passwordError {
            color: #ff3333;
            margin-top: 8px;
            font-size: 12px;
        }

        /* 网格样式 */
        #gridContainer {
            margin: 20px 0;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(16, 25px);
            grid-template-rows: repeat(13, 25px);
            gap: 3px;
            background: #e0e0e0;
            padding: 2px;
            border: 1px solid #e0e0e0;
        }

        .cell {
            width: 25px;
            height: 25px;
            background: #ffffff;
            position: relative;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .cell:hover {
            background-color: #f5f5f5;
        }

        .cell.number-cell {
            background: #f0f0f0;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #333333;
        }

        .cell.number-cell:hover {
            background: #f0f0f0;
        }

        /* 圈形样式 */
        .circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        .circle.red {
            background: #fe0002;
            border: 1px solid #000000;
        }

        .circle.blue {
            background: #0000fe;
            border: 1px solid #000000;
        }

        .circle.hidden {
            display: none;
        }

        /* 控制区域 */
        #controls {
            display: none;
            margin-bottom: 20px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .tool-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .tool-btn {
            padding: 8px 16px;
            border: 1px solid #e0e0e0;
            background: #ffffff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #f5f5f5;
        }

        .tool-btn.active {
            background: #e6f7ff;
            border-color: #3366ff;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
        }

        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            position: relative;
            z-index: 1;
            pointer-events: auto;
        }

        #saveBtn {
            background: #52c41a;
            color: white;
        }

        #saveBtn:hover {
            background: #45a612;
        }

        /* 底部按钮区域 */
        #bottomButtons {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .number-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 400px;
        }

        .number-btn {
            flex: 1;
            width: 40px;
            height: 40px;
            padding: 0;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .number-btn:hover {
            background: #f5f5f5;
        }

        .number-btn.active {
            background: #e6f7ff;
            border-color: #3366ff;
        }

        #showAllBtn {
            background: #3366ff;
            color: white;
            padding: 10px 40px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }

        #showAllBtn:hover {
            background: #2952cc;
        }

        /* 状态提示 */
        #status {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }
        
        /* 按钮状态 */
        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .action-btn.loading {
            position: relative;
            color: transparent;
        }
        
        .action-btn.loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spinner 0.8s linear infinite;
        }
        
        @keyframes spinner {
            to {
                transform: rotate(360deg);
            }
        }
        
        /* 确保按钮可点击 */
        .action-btn {
            pointer-events: auto;
            z-index: 1;
            position: relative;
        }
    </style>
</head>
<body>
    <!-- 密码验证区域 -->
    <div id="passwordSection">
        <h2>管理员登录</h2>
        <div style="margin-top: 10px;">
            <input type="password" id="passwordInput" placeholder="请输入管理员密码">
            <button id="passwordBtn">验证</button>
        </div>
        <div id="passwordError"></div>
    </div>

    <!-- 控制区域（初始隐藏） -->
    <div id="controls">
        <div class="tool-buttons">
            <button class="tool-btn" id="redTool" data-tool="red">红圈选择</button>
            <button class="tool-btn" id="blueTool" data-tool="blue">蓝圈选择</button>
            <button class="tool-btn" id="clearTool" data-tool="clear">清空选择</button>
        </div>
        <div class="action-buttons">
            <button class="action-btn" id="saveBtn">确定保存</button>
        </div>
        
        <!-- 数据导出导入区域 -->
        <div style="margin-top: 15px; text-align: center;">
            <button class="action-btn" id="exportBtn" style="background: #1890ff; margin-right: 10px;">导出数据</button>
            <button class="action-btn" id="importBtn" style="background: #52c41a;">导入数据</button>
        </div>
        
        <!-- 导入数据输入区域 -->
        <div id="importArea" style="margin-top: 10px; display: none; position: relative; z-index: 20;">
            <textarea id="importData" placeholder="请粘贴导出的数据..." style="width: 300px; height: 100px; padding: 8px; border: 1px solid #e0e0e0; border-radius: 4px; font-family: monospace; font-size: 12px; resize: vertical;"></textarea>
            <div style="margin-top: 8px;">
                <button id="confirmImport" style="padding: 6px 12px; background: #52c41a; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 8px; position: relative; z-index: 1;">确认导入</button>
                <button id="cancelImport" style="padding: 6px 12px; background: #f5f5f5; border: 1px solid #e0e0e0; border-radius: 4px; cursor: pointer; position: relative; z-index: 1;">取消</button>
            </div>
            <div id="importError" style="color: #ff3333; font-size: 12px; margin-top: 5px; min-height: 16px;"></div>
        </div>
    </div>

    <!-- 网格容器 -->
    <div id="gridContainer">
        <div id="grid"></div>
    </div>

    <!-- 底部按钮区域 -->
    <div id="bottomButtons">
        <div class="number-buttons">
            <button class="number-btn" data-col="1">1</button>
            <button class="number-btn" data-col="2">2</button>
            <button class="number-btn" data-col="3">3</button>
            <button class="number-btn" data-col="4">4</button>
            <button class="number-btn" data-col="5">5</button>
            <button class="number-btn" data-col="6">6</button>
            <button class="number-btn" data-col="7">7</button>
            <button class="number-btn" data-col="8">8</button>
        </div>
        <div class="number-buttons">
            <button class="number-btn" data-col="9">9</button>
            <button class="number-btn" data-col="10">10</button>
            <button class="number-btn" data-col="11">11</button>
            <button class="number-btn" data-col="12">12</button>
            <button class="number-btn" data-col="13">13</button>
            <button class="number-btn" data-col="14">14</button>
            <button class="number-btn" data-col="15">15</button>
            <button class="number-btn" data-col="16">16</button>
        </div>
        <button id="showAllBtn">显示全部</button>
    </div>

    <!-- 状态提示 -->
    <div id="status"></div>

    <script>
        // 管理员密码配置（可修改）
        const ADMIN_PASSWORD = '8888'; // 修改此处可更改管理员密码
        
        // 全局变量
        let isAdmin = false;
        let currentTool = 'red';
        let isDragging = false;
        let currentColumn = null;
        
        const rows = 13;
        const cols = 16;
        const numberRow = 6; // 第6行是数字行（0索引为5）
        
        // 网格数据存储
        let gridData = {};
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeGrid();
            applyPresetCoordinates(); // 应用预设坐标
            loadFromLocalStorage();
            setupEventListeners();
        });
        
        // 初始化网格
        function initializeGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    // 第6行是数字行（索引5）
                    if (row === numberRow - 1) {
                        cell.classList.add('number-cell');
                        cell.textContent = col + 1;
                    }
                    
                    grid.appendChild(cell);
                }
            }
        }
        
        // 预设坐标配置（按 "第 X 行第 Y 列 = 颜色" 格式）
        function getPresetCoordinates() {
            const presets = {};
            
            // 第 1 行：1-8 列 = 红圈，9-16 列 = 蓝圈
            for (let col = 0; col < 8; col++) presets[`0-${col}`] = 'red';
            for (let col = 8; col < 16; col++) presets[`0-${col}`] = 'blue';
            
            // 第 2 行：1-4 列 = 红圈，5-11 列 = 蓝圈，12-16 列 = 红圈
            for (let col = 0; col < 4; col++) presets[`1-${col}`] = 'red';
            for (let col = 4; col < 11; col++) presets[`1-${col}`] = 'blue';
            for (let col = 11; col < 16; col++) presets[`1-${col}`] = 'red';
            
            // 第 3 行：1-2 列 = 红圈，3-6 列 = 蓝圈，7-8 列 = 红圈，9-10 列 = 蓝圈，11-14 列 = 红圈，15-16 列 = 蓝圈
            for (let col = 0; col < 2; col++) presets[`2-${col}`] = 'red';
            for (let col = 2; col < 6; col++) presets[`2-${col}`] = 'blue';
            for (let col = 6; col < 8; col++) presets[`2-${col}`] = 'red';
            for (let col = 8; col < 10; col++) presets[`2-${col}`] = 'blue';
            for (let col = 10; col < 14; col++) presets[`2-${col}`] = 'red';
            for (let col = 14; col < 16; col++) presets[`2-${col}`] = 'blue';
            
            // 第 4 行：1 列 = 红圈，2 列 = 蓝圈，3 列 = 红圈，4-5 列 = 蓝圈，6-7 列 = 红圈，8-9 列 = 蓝圈，10 列 = 红圈，11 列 = 蓝圈，12-13 列 = 红圈，14-15 列 = 蓝圈，16 列 = 红圈
            presets[`3-0`] = 'red';
            presets[`3-1`] = 'blue';
            presets[`3-2`] = 'red';
            for (let col = 3; col < 5; col++) presets[`3-${col}`] = 'blue';
            for (let col = 5; col < 7; col++) presets[`3-${col}`] = 'red';
            for (let col = 7; col < 9; col++) presets[`3-${col}`] = 'blue';
            presets[`3-9`] = 'red';
            presets[`3-10`] = 'blue';
            for (let col = 11; col < 13; col++) presets[`3-${col}`] = 'red';
            for (let col = 13; col < 15; col++) presets[`3-${col}`] = 'blue';
            presets[`3-15`] = 'red';
            
            // 第 7 行：1-4 列 = 红圈，5 列 = 蓝圈，6-8 列 = 红圈，9-12 列 = 蓝圈，13 列 = 红圈，14-16 列 = 蓝圈
            for (let col = 0; col < 4; col++) presets[`6-${col}`] = 'red';
            presets[`6-4`] = 'blue';
            for (let col = 5; col < 8; col++) presets[`6-${col}`] = 'red';
            for (let col = 8; col < 12; col++) presets[`6-${col}`] = 'blue';
            presets[`6-12`] = 'red';
            for (let col = 13; col < 16; col++) presets[`6-${col}`] = 'blue';
            
            // 第 8 行：1-3 列 = 红圈，4-5 列 = 蓝圈，6-8 列 = 红圈，9-10 列 = 蓝圈，11-14 列 = 红圈，15-16 列 = 蓝圈
            for (let col = 0; col < 3; col++) presets[`7-${col}`] = 'red';
            for (let col = 3; col < 5; col++) presets[`7-${col}`] = 'blue';
            for (let col = 5; col < 8; col++) presets[`7-${col}`] = 'red';
            for (let col = 8; col < 10; col++) presets[`7-${col}`] = 'blue';
            for (let col = 10; col < 14; col++) presets[`7-${col}`] = 'red';
            for (let col = 14; col < 16; col++) presets[`7-${col}`] = 'blue';
            
            // 第 9 行：1-3 列 = 蓝圈，4-5 列 = 红圈，6 列 = 蓝圈，7-8 列 = 蓝圈，9-10 列 = 红圈，11 列 = 蓝圈，12-13 列 = 蓝圈，14-16 列 = 红圈
            for (let col = 0; col < 3; col++) presets[`8-${col}`] = 'blue';
            for (let col = 3; col < 5; col++) presets[`8-${col}`] = 'red';
            presets[`8-5`] = 'blue';
            for (let col = 6; col < 8; col++) presets[`8-${col}`] = 'blue';
            for (let col = 8; col < 10; col++) presets[`8-${col}`] = 'red';
            presets[`8-10`] = 'blue';
            for (let col = 11; col < 13; col++) presets[`8-${col}`] = 'blue';
            for (let col = 13; col < 16; col++) presets[`8-${col}`] = 'red';
            
            // 第 10 行：1 列 = 红圈，2 列 = 红圈，3 列 = 蓝圈，4 列 = 红圈，5 列 = 蓝圈，6-7 列 = 蓝圈，8-9 列 = 红圈，10-12 列 = 蓝圈，13-14 列 = 红圈，15-16 列 = 蓝圈
            presets[`9-0`] = 'red';
            presets[`9-1`] = 'red';
            presets[`9-2`] = 'blue';
            presets[`9-3`] = 'red';
            presets[`9-4`] = 'blue';
            for (let col = 5; col < 7; col++) presets[`9-${col}`] = 'blue';
            for (let col = 7; col < 9; col++) presets[`9-${col}`] = 'red';
            for (let col = 9; col < 12; col++) presets[`9-${col}`] = 'blue';
            for (let col = 12; col < 14; col++) presets[`9-${col}`] = 'red';
            for (let col = 14; col < 16; col++) presets[`9-${col}`] = 'blue';
            
            // 第 11 行：1 列 = 红圈，2 列 = 蓝圈，3 列 = 红圈，4 列 = 蓝圈，5 列 = 红圈，6 列 = 蓝圈，7-9 列 = 红圈，10 列 = 蓝圈，11 列 = 红圈，12-14 列 = 蓝圈，15-16 列 = 蓝圈
            presets[`10-0`] = 'red';
            presets[`10-1`] = 'blue';
            presets[`10-2`] = 'red';
            presets[`10-3`] = 'blue';
            presets[`10-4`] = 'red';
            presets[`10-5`] = 'blue';
            for (let col = 6; col < 9; col++) presets[`10-${col}`] = 'red';
            presets[`10-9`] = 'blue';
            presets[`10-10`] = 'red';
            for (let col = 11; col < 14; col++) presets[`10-${col}`] = 'blue';
            for (let col = 14; col < 16; col++) presets[`10-${col}`] = 'blue';
            
            // 第 12 行：1 列 = 红圈，2-8 列 = 蓝圈，9 列 = 红圈，10 列 = 蓝圈，11-15 列 = 红圈，16 列 = 蓝圈
            presets[`11-0`] = 'red';
            for (let col = 1; col < 8; col++) presets[`11-${col}`] = 'blue';
            presets[`11-8`] = 'red';
            presets[`11-9`] = 'blue';
            for (let col = 10; col < 15; col++) presets[`11-${col}`] = 'red';
            presets[`11-15`] = 'blue';
            
            return presets;
        }
        
        // 应用预设坐标
        function applyPresetCoordinates() {
            const presets = getPresetCoordinates();
            
            Object.keys(presets).forEach(key => {
                const [row, col] = key.split('-').map(Number);
                const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                
                if (cell && !cell.classList.contains('number-cell')) {
                    const circle = document.createElement('div');
                    circle.className = `circle ${presets[key]}`;
                    cell.appendChild(circle);
                    
                    // 保存到网格数据
                    gridData[key] = presets[key];
                }
            });
            
            updateColumnVisibility();
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 密码验证
            document.getElementById('passwordBtn').addEventListener('click', verifyPassword);
            document.getElementById('passwordInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') verifyPassword();
            });
            
            // 工具按钮
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    setTool(this.dataset.tool);
                });
            });
            
            // 操作按钮
            document.getElementById('saveBtn').addEventListener('click', saveToLocalStorage);
            
            // 导出导入按钮 - 使用更可靠的事件绑定
            const exportBtn = document.getElementById('exportBtn');
            const importBtn = document.getElementById('importBtn');
            const confirmImportBtn = document.getElementById('confirmImport');
            const cancelImportBtn = document.getElementById('cancelImport');
            
            if (exportBtn) {
                exportBtn.addEventListener('click', exportData);
                exportBtn.style.pointerEvents = 'auto';
            }
            
            if (importBtn) {
                importBtn.addEventListener('click', importData);
                importBtn.style.pointerEvents = 'auto';
            }
            
            if (confirmImportBtn) {
                confirmImportBtn.addEventListener('click', importData);
                confirmImportBtn.style.pointerEvents = 'auto';
            }
            
            if (cancelImportBtn) {
                cancelImportBtn.addEventListener('click', cancelImport);
                cancelImportBtn.style.pointerEvents = 'auto';
            }
            
            // 数字按钮
            document.querySelectorAll('.number-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    showColumnOnly(Number(this.dataset.col));
                });
            });
            
            // 显示全部按钮
            document.getElementById('showAllBtn').addEventListener('click', showAllColumns);
            
            // 网格事件（使用事件委托）
            document.getElementById('grid').addEventListener('mousedown', handleCellMouseDown);
            document.getElementById('grid').addEventListener('mouseover', handleCellMouseOver);
            document.addEventListener('mouseup', handleMouseUp);
            
            // 防止拖拽选择文本
            document.getElementById('grid').addEventListener('selectstart', function(e) {
                e.preventDefault();
            });
            
            // 添加键盘事件支持
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    // ESC键取消导入
                    const importArea = document.getElementById('importArea');
                    if (importArea && importArea.style.display !== 'none') {
                        cancelImport();
                    }
                }
            });
        }
        
        // 验证密码
        function verifyPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('passwordError');
            
            if (input === ADMIN_PASSWORD) {
                isAdmin = true;
                document.getElementById('passwordSection').style.display = 'none';
                document.getElementById('controls').style.display = 'block';
                document.getElementById('passwordInput').disabled = true;
                errorDiv.textContent = '';
                showStatus('管理员验证成功，可以开始操作');
            } else {
                errorDiv.textContent = '密码错误，请重试';
                document.getElementById('passwordInput').value = '';
            }
        }
        
        // 设置工具
        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tool === tool);
            });
            showStatus(`当前工具：${tool === 'red' ? '红圈' : tool === 'blue' ? '蓝圈' : '清空'}`);
        }
        
        // 处理单元格鼠标按下
        function handleCellMouseDown(e) {
            if (!isAdmin) return;
            
            const cell = e.target;
            if (!cell.classList.contains('cell') || cell.classList.contains('number-cell')) return;
            
            isDragging = true;
            applyToolToCell(cell);
            e.preventDefault();
        }
        
        // 处理单元格鼠标悬停
        function handleCellMouseOver(e) {
            if (!isAdmin || !isDragging) return;
            
            const cell = e.target;
            if (!cell.classList.contains('cell') || cell.classList.contains('number-cell')) return;
            
            applyToolToCell(cell);
        }
        
        // 处理鼠标释放
        function handleMouseUp() {
            isDragging = false;
        }
        
        // 应用工具到单元格
        function applyToolToCell(cell) {
            const row = cell.dataset.row;
            const col = cell.dataset.col;
            const key = `${row}-${col}`;
            
            // 移除现有圈形
            const existingCircle = cell.querySelector('.circle');
            if (existingCircle) {
                existingCircle.remove();
            }
            
            if (currentTool === 'clear') {
                delete gridData[key];
            } else {
                // 创建新圈形
                const circle = document.createElement('div');
                circle.className = `circle ${currentTool}`;
                cell.appendChild(circle);
                
                // 保存数据
                gridData[key] = currentTool;
            }
            
            updateColumnVisibility();
        }
        
        // 仅显示指定列
        function showColumnOnly(col) {
            currentColumn = col;
            updateColumnVisibility();
            
            // 更新按钮状态
            document.querySelectorAll('.number-btn').forEach(btn => {
                btn.classList.toggle('active', Number(btn.dataset.col) === col);
            });
        }
        
        // 显示所有列
        function showAllColumns() {
            currentColumn = null;
            updateColumnVisibility();
            
            // 清除按钮激活状态
            document.querySelectorAll('.number-btn').forEach(btn => {
                btn.classList.remove('active');
            });
        }
        
        // 更新列可见性
        function updateColumnVisibility() {
            document.querySelectorAll('.cell').forEach(cell => {
                if (cell.classList.contains('number-cell')) return;
                
                const col = Number(cell.dataset.col) + 1; // 转换为1索引
                const circle = cell.querySelector('.circle');
                
                if (circle) {
                    if (currentColumn === null || currentColumn === col) {
                        circle.classList.remove('hidden');
                    } else {
                        circle.classList.add('hidden');
                    }
                }
            });
        }
        
        // 保存到本地存储
        function saveToLocalStorage() {
            localStorage.setItem('gridData', JSON.stringify(gridData));
            showStatus('数据已保存到本地存储');
        }
        
        // 导出数据
        function exportData() {
            const exportBtn = document.getElementById('exportBtn');
            const originalText = exportBtn.textContent;
            
            try {
                // 显示加载状态
                exportBtn.classList.add('loading');
                exportBtn.disabled = true;
                
                const exportObj = {
                    version: '1.0',
                    timestamp: new Date().toISOString(),
                    gridData: gridData,
                    totalCircles: Object.keys(gridData).length
                };
                
                const exportText = JSON.stringify(exportObj, null, 2);
                
                // 使用现代剪贴板API
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(exportText).then(() => {
                        showStatus('数据已导出并复制到剪贴板');
                        exportBtn.classList.remove('loading');
                        exportBtn.disabled = false;
                    }).catch(() => {
                        // 如果现代API失败，使用备用方法
                        fallbackCopyToClipboard(exportText, exportBtn, originalText);
                    });
                } else {
                    // 使用传统方法
                    fallbackCopyToClipboard(exportText, exportBtn, originalText);
                }
                
            } catch (error) {
                showStatus('导出失败：' + error.message);
                exportBtn.classList.remove('loading');
                exportBtn.disabled = false;
            }
        }
        
        // 备用复制方法
        function fallbackCopyToClipboard(text, button, originalText) {
            try {
                // 创建临时文本区域用于复制
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                textarea.style.pointerEvents = 'none';
                document.body.appendChild(textarea);
                textarea.select();
                
                const successful = document.execCommand('copy');
                document.body.removeChild(textarea);
                
                if (successful) {
                    showStatus('数据已导出并复制到剪贴板');
                } else {
                    // 如果复制失败，显示文本供手动复制
                    showExportDialog(text);
                }
                
                button.classList.remove('loading');
                button.disabled = false;
                
            } catch (err) {
                // 如果复制失败，显示文本供手动复制
                showExportDialog(text);
                button.classList.remove('loading');
                button.disabled = false;
            }
        }
        
        // 显示导出对话框
        function showExportDialog(text) {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.5);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
            `;
            
            const content = document.createElement('div');
            content.style.cssText = `
                background: white;
                padding: 20px;
                border-radius: 8px;
                max-width: 500px;
                max-height: 400px;
                overflow: auto;
            `;
            
            content.innerHTML = `
                <h3>导出数据</h3>
                <p>请复制以下文本：</p>
                <textarea readonly style="width: 100%; height: 200px; font-family: monospace; font-size: 12px; padding: 8px; border: 1px solid #e0e0e0; border-radius: 4px;">${text}</textarea>
                <div style="text-align: right; margin-top: 15px;">
                    <button onclick="this.closest('.export-modal').remove()" style="padding: 8px 16px; background: #f5f5f5; border: 1px solid #e0e0e0; border-radius: 4px; cursor: pointer;">关闭</button>
                </div>
            `;
            
            modal.className = 'export-modal';
            modal.appendChild(content);
            document.body.appendChild(modal);
        }
        
        // 导入数据
        function importData() {
            const importBtn = document.getElementById('importBtn');
            const importArea = document.getElementById('importArea');
            const importDataTextarea = document.getElementById('importData');
            const importError = document.getElementById('importError');
            
            if (importArea.style.display === 'none') {
                // 显示导入区域
                importArea.style.display = 'block';
                importDataTextarea.focus();
                importBtn.textContent = '确认导入';
            } else {
                // 执行导入操作
                const originalText = importBtn.textContent;
                
                try {
                    // 显示加载状态
                    importBtn.classList.add('loading');
                    importBtn.disabled = true;
                    
                    const importText = importDataTextarea.value.trim();
                    if (!importText) {
                        throw new Error('请输入要导入的数据');
                    }
                    
                    let importObj;
                    try {
                        importObj = JSON.parse(importText);
                    } catch (parseError) {
                        throw new Error('数据格式错误，请重新粘贴');
                    }
                    
                    // 验证数据格式
                    if (!importObj.gridData || typeof importObj.gridData !== 'object') {
                        throw new Error('无效的数据格式');
                    }
                    
                    // 确认导入
                    if (confirm(`确定要导入数据吗？这将覆盖当前所有圈形状态。\n共 ${Object.keys(importObj.gridData).length} 个圈形。`)) {
                        // 清空当前状态
                        document.querySelectorAll('.circle').forEach(circle => {
                            circle.remove();
                        });
                        
                        // 应用导入的数据
                        gridData = importObj.gridData;
                        applySavedData();
                        
                        // 隐藏导入区域并重置按钮
                        importArea.style.display = 'none';
                        importDataTextarea.value = '';
                        importError.textContent = '';
                        importBtn.classList.remove('loading');
                        
                        showStatus('数据导入成功');
                        
                        // 保存到本地存储
                        localStorage.setItem('gridData', JSON.stringify(gridData));
                    }
                    
                } catch (error) {
                    importError.textContent = error.message;
                    showStatus('导入失败：' + error.message);
                } finally {
                    importBtn.classList.remove('loading');
                    importBtn.disabled = false;
                }
            }
        }
        
        // 取消导入
        function cancelImport() {
            const importBtn = document.getElementById('importBtn');
            document.getElementById('importArea').style.display = 'none';
            document.getElementById('importData').value = '';
            document.getElementById('importError').textContent = '';
            
            // 重置按钮状态
            importBtn.classList.remove('loading');
            importBtn.disabled = false;
        }
        
        // 从本地存储加载
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('gridData');
            if (saved) {
                try {
                    gridData = JSON.parse(saved);
                    applySavedData();
                    showStatus('已加载保存的数据');
                } catch (e) {
                    console.error('加载数据失败:', e);
                    gridData = {};
                }
            }
        }
        
        // 应用保存的数据
        function applySavedData() {
            Object.keys(gridData).forEach(key => {
                const [row, col] = key.split('-').map(Number);
                const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                
                if (cell && !cell.classList.contains('number-cell')) {
                    const circle = document.createElement('div');
                    circle.className = `circle ${gridData[key]}`;
                    cell.appendChild(circle);
                }
            });
            
            updateColumnVisibility();
        }
        
        // 显示状态信息
        function showStatus(message) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            setTimeout(() => {
                statusDiv.textContent = '';
            }, 3000);
        }
        
        // 默认选中红圈工具
        setTool('red');
    </script>

    <!-- 使用说明（粤语） -->
    <!-- 
    使用说明：
    1. 密码验证：输入管理员密码（默认8888）解锁操作功能
    2. 列显示/隐藏：点击底部数字按钮显示对应列，点击"显示全部"显示所有列
    3. 圈形设置：选择红圈/蓝圈/清空工具，点击或拖动网格设置圈形
    4. 保存加载：点击"确定保存"保存数据，下次打开自动加载
    5. 预设坐标：已按指定格式设置好红蓝圈坐标
    
    修改说明：
    - 管理员密码：修改ADMIN_PASSWORD变量
    - 圈形颜色：修改.circle.red和.circle.blue的background属性
    - 网格大小：修改rows、cols、cell尺寸相关CSS
    - 按钮样式：修改对应按钮的CSS类
    -->
</body>
